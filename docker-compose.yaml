services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: backend-template-api
    command: gunicorn --bind 0.0.0.0:${PORT:-5000} --workers 4 app.main:app
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    # depends_on:
    # healthcheck:
    restart: unless-stopped

