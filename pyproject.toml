[project]
name = "backend-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=26.2.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "flasgger>=0.9.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "freezegun>=1.5.5",
    "ruff>=0.17.4",
    "flake8>=7.5.0",
    "flake8-pyproject>=1.2.4",
    "bandit>=1.9.4",
    "pre-commit>=4.7.0",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["I"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E501", "E203"]  # E501 and E203 are handled by ruff.
exclude = [".git", "__pycache__", ".venv", "htmlcov"]
per-file-ignores = ["__init__.py:F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=100"

[tool.coverage.run]
source = ["app"]
omit = ["app/docs.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
